<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
        }

        footer {
            background: #002F61; /* same deep blue as header */
            color: white;
            font-family: Montserrat, sans-serif;
            text-align: left;
            padding: 25px 20px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;

            /* ALWAYS stick to bottom */
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;

            /* subtle header-style shadow */
            box-shadow: 0 -2px 8px rgba(0,0,0,0.25);
        }

        footer .brand {
            font-weight: 700;
            font-size: 18px;
        }

        footer a {
            color: #4DA3FF;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <footer>
        <div class="brand">Catholic Church Map</div>
        Designed By George Clune
        <br>
        © 2026 — All Rights Reserved
    </footer>
</body>
</html>
