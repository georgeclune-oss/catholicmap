<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <title>Ireland</title>

    <!-- Montserrat font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Montserrat, sans-serif;
        }

        main {
            padding: 40px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- Header placeholder -->
    <div id="header"></div>

    <!-- Main content (blank for now) -->
    <main style="padding:0; margin:0; height:calc(100vh - 160px);">
    <iframe 
        src="MapFolder/index.html"
        style="border:none; width:100%; height:100%; display:block;"
        loading="lazy"
    ></iframe>
</main>



    <!-- Footer placeholder -->
    <div id="footer"></div>

    <!-- Load header + footer -->
    <script>
        fetch("header.html")
            .then(r => r.text())
            .then(d => document.getElementById("header").innerHTML = d);

        fetch("footer.html")
            .then(r => r.text())
            .then(d => document.getElementById("footer").innerHTML = d);
    </script>

</body>
</html>
