<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ireland</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: Montserrat, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        #header,
        #footer {
            width: 100%;
        }

        main {
            width: 100%;
        }

        main iframe {
            width: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Map -->
    <main>
        <iframe
            id="mapFrame"
            src="MapFolder/index.html"
            title="Map of 

    <script>

        function resizeMap() {
            const header = document.getElementById("header");
            const map = document.getElementById("mapFrame");

            const headerHeight = header.offsetHeight;

            map.style.height = `${window.innerHeight - headerHeight}px`;
        }

        fetch("header.html")
            .then(r => r.text())
            .then(d => {
                document.getElementById("header").innerHTML = d;
                resizeMap();
            });

        fetch("footer.html")
            .then(r => r.text())
            .then(d => {
                document.getElementById("footer").innerHTML = d;
            });

        window.addEventListener("resize", resizeMap);

    </script>

</body>
</html>
