<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Montserrat, sans-serif;
    background: #FFFEE8;
}

/* Make ONLY h1 + h2 dark blue */
h1, h2, h3 {
    color: #E8DC00;
    font-weight: 700;
}
.left-header {
    display: flex;
    align-items: center;
    gap: 12px; /* space between logo and text */
}

.vatican-logo {
    height: 30px;     /* change size here */
    width: auto;
}

/* HEADER BAR */
.header-container {
    background: #E8DC00;
    color: white;
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    flex-wrap: wrap;
    text-align: center;
}


.site-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

/* SEARCH BAR */
.search-container {
    display: flex;
    align-items: center;
}

.search-input {
    width: 180px;
    padding: 8px 12px;
    border-radius: 20px;
    border: none;
    outline: none;
    font-size: 16px;
    font-family: Montserrat, sans-serif;
    transition: width 0.3s ease;
}

.search-input:focus {
    width: 260px;
}

nav {
    width: 100%;
    background: #C9BF00;
    color: white;
   padding: 5px 30px;
    display: flex;
    justify-content: space-around; /* SAME AS HEADER */
    align-items: center;
    box-sizing: border-box;
}


.nav-left {
    flex: 0; /* behaves like the title */
}


.nav-right {
    flex: 1;
    min-width: 180px;   /* SAME as search bar */
    max-width: 260px;   /* SAME as search bar focus width */
    display: flex;
    justify-content: flex-end;
    gap: 25px;
}


nav a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    transition: 0.2s;
    position: relative;
}

nav a:hover {
    opacity: 0.7;
}
    nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0%;
    height: 2px;
    background: white;
    transition: 0.3s ease;
}

nav a:hover::after {
    width: 100%;
}

  

/* MOBILE */
@media (max-width: 700px) {

    .header-container {
        flex-direction: row; /* keep title + search bar side-by-side */
        justify-content: space-between; /* title left, search right */
        align-items: center;
        padding: 15px 20px;
        gap: 10px;
        text-align: left;
    }

    .search-input {
        width: 140px; /* fits on mobile */
        max-width: 200px;
    }

    nav {
        justify-content: flex-end; /* keep nav under search bar */
        padding: 12px 40px; /* reduce huge padding */
    }
}
html, body {
    height: 100%;
    margin: 0;
}

.page-wrapper {
    min-height: 100%;
    display: flex;
    flex-direction: column;
}

footer {
    margin-top: auto; /* pushes footer to bottom */
    background: #002F61;
    color: white;
    text-align: center;
    padding: 20px;
}


</style>

<div class="header-container">

    <div class="left-header">
        <img src="coat.jpg" class="vatican-logo">
        <a href="index.html" class="site-title">CATHOLIC CHURCH MAP</a>
    </div>

   

</div>


<div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search..." onkeydown="if (event.key === 'Enter') performSearch()">
    </div>

    <nav>
    <div class="nav-left"></div> <!-- empty -->
    <div class="nav-right">
        <a href="index.html">Home</a>
        <a href="data-licensing.html">Data Licensing</a>
    </div>
</nav>



<script>
function performSearch() {
    const query = document.getElementById("searchInput").value.trim();
    if (query.length > 0) {
        window.location.href = `https://www.bing.com/search?q=site:georgeclune-oss.github.io/website+${encodeURIComponent(query)}`;
    }
}
</script>
