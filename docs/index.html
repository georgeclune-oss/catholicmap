<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6139547779947241"
     crossorigin="anonymous"></script>
    
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Montserrat, sans-serif;
            
        }

        





        
    </style>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
</head>

    <body>

<div id="header"></div>

<!-- FULL-WIDTH HERO WITH TEXT ON TOP -->
<div style="
    position: relative;
    width: 100%;
    height: 800px;   /* adjust for more/less crop */
    overflow: hidden;
">

    <!-- Background Image -->
    <img src="picture.jpg"
         alt="St. Peter’s Basilica"
         style="
             width: 100%;
             height: 100%;
             object-fit: cover;
             object-position: center 40%;
             display: block;

             /* DARKER + MORE TRANSPARENT */
             filter: brightness(0.75) saturate(0.7);
             opacity: 0.65;
         ">
    
    <!-- TEXT ON TOP -->
    <div style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-family: Montserrat, sans-serif;
        width: 90%;
    ">
        <h1 style="
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #E8DC7A; /* light gold */
            text-shadow: 0 2px 6px rgba(0,0,0,0.45);
        ">
            Global Catholic Church Mapping Project
        </h1>

        <p style="
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 20px;
            color: #FFFEE8; /* soft cream */
            text-shadow: 0 2px 6px rgba(0,0,0,0.45);
        ">
            Mapping every Catholic church on Earth with precision and respect.
        </p>

        <a href="worldchurches.html"
           style="
               display: inline-block;
               padding: 12px 30px;
               background: rgba(255,255,255,0.85);
               color: #545000;
               font-weight: 700;
               border-radius: 8px;
               text-decoration: none;
               font-size: 1.1rem;
               backdrop-filter: blur(4px);
           ">
            Enter Global Map
        </a>
    </div>

</div>



</section>

<div id="footer"></div>

<script>
fetch("header.html")
  .then(r => r.text())
  .then(d => document.getElementById("header").innerHTML = d);

fetch("footer.html")
  .then(r => r.text())
  .then(d => document.getElementById("footer").innerHTML = d);
</script>

</body>





</html>
