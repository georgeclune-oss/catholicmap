        html, body {
            overflow-x: hidden;

        body {
            font-family: Montserrat, sans-serif;
            background: #EBF8FF;

        nav {
            background: #333;
            padding: 10px;

            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;

       .section-title {
    text-align: center;
    margin-top: 40px;   /* NEW: spacing from header */
    margin-bottom: 10px;
    font-size: 26px;
    font-weight: bold;
}


#header {
    display: block;
    margin: 0;
    padding: 0;
}

        .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 35px; /* spacing between cards */
    padding: 20px; /* spacing around the grid */
    max-width: 1200px;
    margin: auto;
}


.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    transition: 0.2s;
    cursor: pointer;
    max-width: 100%; /* prevents overflow */
}



        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
            cursor: pointer;
            width: 100%;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card h3 {
            margin-top: 0;
        }

        /* GLOBAL MOBILE BEHAVIOUR (same as Spaceports + Data Licensing) */
        .content,
        .content-wrapper,
        .main,
        .container {
            max-width: 100%;
            margin: 0;
            padding: 10px 15px;
        }

        * {
            max-width: 100%;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }


        @media (max-width: 700px) {
            html, body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            * {
                max-width: 100% !important;
                box-sizing: border-box;

<div id="header"></div>

<!-- FULL-WIDTH HERO WITH TEXT ON TOP -->
<div style="
    position: relative;
    width: 100%;
    height: 350px;   /* adjust for more/less crop */
    overflow: hidden;
">

    <!-- Background Image -->
    <img src="yoo.jpg"
         alt="St. Peter’s Basilica"
         style="
             width: 100%;
             height: 100%;
             object-fit: cover;
             object-position: center 40%;
             display: block;

             /* White fade + transparency */
             filter: brightness(1.35) saturate(0.75);
             opacity: 0.80;
         ">
    
    <!-- TEXT ON TOP -->
    <div style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #ffffff;
        font-family: Montserrat, sans-serif;
        text-shadow: 0 2px 6px rgba(0,0,0,0.4);
        width: 90%;
    ">
        <h1 style="font-size: 3rem; font-weight: 700; margin-bottom: 10px;">
            Global Catholic Church Mapping Project
        </h1>

        <p style="font-size: 1.2rem; font-weight: 500; margin-bottom: 20px;">

        </p>

        <a href="worldchurches.html"
           style="
               display: inline-block;
               padding: 12px 30px;
               background: rgba(255,255,255,0.85);
               color: #545000;
               font-weight: 700;
               border-radius: 8px;
               text-decoration: none;
               font-size: 1.1rem;
               backdrop-filter: blur(4px);
           ">
            Enter Global Map
        </a>
    </div>

</div>

</section>
