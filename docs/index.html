        body {

            background: #EBF8FF;

        nav {
            background: #333;

            gap: 20px;

        nav a {
            color: white;

       .section-title {
    text-align: center;

    font-weight: bold;
}


#header {
    display: block;
    margin: 0;

}

        .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 35px; /* spacing between cards */
    padding: 20px; /* spacing around the grid */
    max-width: 1200px;
    margin: auto;
}


.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    transition: 0.2s;
    cursor: pointer;
    max-width: 100%; /* prevents overflow */
}



        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
            cursor: pointer;
            width: 100%;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card h3 {
            margin-top: 0;
        }

        /* GLOBAL MOBILE BEHAVIOUR (same as Spaceports + Data Licensing) */
        .content,
        .content-wrapper,

            max-width: 100%;
            margin: 0;
            padding: 10px 15px;
        }

        * {
            max-width: 100%;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }


        @media (max-width: 700px) {
            html, body {
                width: 100%;

<body>

<div id="header"></div>

</section>

<!-- Load header + footer -->
