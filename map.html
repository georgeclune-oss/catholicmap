        <script>
        function getVisited() {
    return JSON.parse(localStorage.getItem('visitedChurches')) || [];
}

function markVisited(fid) {
    let visited = getVisited();
    if (!visited.includes(fid)) {
        visited.push(fid);
        localStorage.setItem('visitedChurches', JSON.stringify(visited));
    }
}

function unvisit(fid) {
    let visited = getVisited().filter(v => v !== fid);
    localStorage.setItem('visitedChurches', JSON.stringify(visited));
}
function style_Churches_3_0(feature) {
    const isVisited = getVisited().includes(feature.properties.fid);

    return {
        pane: 'pane_Churches_3',
        radius: 5,

        // OUTLINE COLOR
        color: isVisited ? "#006600" : "#7a0000",   // dark green vs dark red

        weight: 2,
        fillOpacity: 1,

        // FILL COLOR
        fillColor: isVisited ? "#00cc44" : "#d5003c",  // green vs original red

        interactive: true
    };
}


function visitedColor(fid) {
    return getVisited().includes(fid)
        ? "#00cc44"   // visited
        : "#d5003c";  // unvisited
}

        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[47.76447055647085,-17.072993036544343],[60.415688006764604,2.2945635609838213]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            map.setMaxBounds(map.getBounds());
            map.setMinZoom(map.getZoom());
        }
        map.createPane('pane_Positron_0');
        map.getPane('pane_Positron_0').style.zIndex = 400;
        var layer_Positron_0 = L.tileLayer('https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
            pane: 'pane_Positron_0',
            opacity: 1.0,
            attribution: '<a href="https://cartodb.com/basemaps/">Map tiles by CartoDB, under CC BY 4.0. Data by OpenStreetMap, under ODbL.</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_Positron_0;
        map.addLayer(layer_Positron_0);
        function pop_dioceses_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['dioceseid'] !== null ? autolinker.link(String(feature.properties['dioceseid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['diocese'] !== null ? autolinker.link(String(feature.properties['diocese']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_dioceses_1_0() {
            return {
                pane: 'pane_dioceses_1',
                opacity: 1,
                color: 'rgba(122,122,122,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 3.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(183,72,75,0.0)',
                interactive: false,
            }
        }
        map.createPane('pane_dioceses_1');
        map.getPane('pane_dioceses_1').style.zIndex = 401;
        map.getPane('pane_dioceses_1').style['mix-blend-mode'] = 'normal';
        var layer_dioceses_1 = new L.geoJson(json_dioceses_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_dioceses_1',
            layerName: 'layer_dioceses_1',
            pane: 'pane_dioceses_1',
            onEachFeature: pop_dioceses_1,
            style: style_dioceses_1_0,
        });
        bounds_group.addLayer(layer_dioceses_1);
        map.addLayer(layer_dioceses_1);
        function pop_Parish_2(feature, layer) {
            
        }

        function style_Parish_2_0() {
            return {
                pane: 'pane_Parish_2',
                opacity: 1,
                color: 'rgba(134,134,134,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(183,72,75,0.0)',
                interactive: true,
            }
        }
        map.createPane('pane_Parish_2');
        map.getPane('pane_Parish_2').style.zIndex = 402;
        map.getPane('pane_Parish_2').style['mix-blend-mode'] = 'normal';
        var layer_Parish_2 = new L.geoJson(json_Parish_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Parish_2',
            layerName: 'layer_Parish_2',
            pane: 'pane_Parish_2',
            onEachFeature: pop_Parish_2,
            style: style_Parish_2_0,
        });
        bounds_group.addLayer(layer_Parish_2);
        map.addLayer(layer_Parish_2);
        

  // --- STYLE FUNCTION (visited + unvisited colours) ---
function style_Churches_3_0(feature) {
    const isVisited = getVisited().includes(feature.properties.fid);

    return {
        pane: 'pane_Churches_3',
        radius: 5.2,
        opacity: 1,

        // OUTLINE COLOUR
        color: isVisited ? "#006600" : "#7a0000",   // dark green vs dark red

        dashArray: '',
        lineCap: 'butt',
        lineJoin: 'miter',
        weight: 2.0,

        fill: true,
        fillOpacity: 1,

        // FILL COLOUR
        fillColor: isVisited ? "#00cc44" : "#bb1a24",  // green vs your original red

        interactive: true,
    };
}


// --- CHURCHES LAYER ---
map.createPane('pane_Churches_3');
map.getPane('pane_Churches_3').style.zIndex = 403;
map.getPane('pane_Churches_3').style['mix-blend-mode'] = 'normal';

var layer_Churches_3 = new L.geoJson(json_Churches_3, {
    attribution: '',
    interactive: true,

    dataVar: 'json_Churches_3',
    layerName: 'layer_Churches_3',
    pane: 'pane_Churches_3',

    // --- CUSTOM CLICK HANDLER ---
    onEachFeature: function(feature, layer) {

        layer.on("click", function() {

            // Name
            document.getElementById("churchName").innerText =
                feature.properties.name || "Unnamed Church";

            // Diocese + parish
            const diocese = feature.properties.diocese_min;
            const parish = feature.properties.parish_min;

            document.getElementById("churchDiocese").innerText =
                diocese ? `Diocese: ${diocese}` : "Diocese: Unknown";

            document.getElementById("churchParish").innerText =
                parish ? `Parish: ${parish}` : "Parish: Unknown";

            // Button text
            if (getVisited().includes(feature.properties.fid)) {
                document.getElementById("visitBtn").innerText = "Mark as unvisited";
            } else {
                document.getElementById("visitBtn").innerText = "Mark as visited";
            }

            // --- VISIT TOGGLE ---
            document.getElementById("visitBtn").onclick = () => {

                if (getVisited().includes(feature.properties.fid)) {
                    unvisit(feature.properties.fid);
                } else {
                    markVisited(feature.properties.fid);
                }

                // FULL STYLE UPDATE (fill + outline)
                layer.setStyle(style_Churches_3_0(feature));

                // Update button text
                document.getElementById("visitBtn").innerText =
                    getVisited().includes(feature.properties.fid)
                        ? "Mark as unvisited"
                        : "Mark as visited";
            };

            // Directions
            document.getElementById("directionsBtn").onclick = () => {
                let lat = feature.geometry.coordinates[1];
                let lng = feature.geometry.coordinates[0];
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`);
            };

            // Slide panel up
            document.getElementById("infoPanel").style.bottom = "0px";
        });
    },

    // --- MARKER SHAPE ---
    pointToLayer: function (feature, latlng) {
        return L.circleMarker(latlng, style_Churches_3_0(feature));
    },
});

bounds_group.addLayer(layer_Churches_3);
map.addLayer(layer_Churches_3);
</script>
